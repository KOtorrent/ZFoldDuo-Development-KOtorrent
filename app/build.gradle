plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.foldduo.hinge'
    compileSdk 37

    defaultConfig {
        applicationId 'com.foldduo.hinge'
        minSdk 33
        targetSdk 37
        versionCode 68
        versionName '0.0.1-diagnostic7'
    }

    signingConfigs {
        stableDebug {
            def storePath = System.getenv('ZFOLD_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('ZFOLD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZFOLD_KEY_ALIAS')
                keyPassword System.getenv('ZFOLD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ZFOLD_KEYSTORE_PATH')) {
                signingConfig signingConfigs.stableDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        aidl true
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.4'
    implementation 'com.flyfishxu:kadb-mdns:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    testImplementation 'junit:junit:4.13.2'
}
